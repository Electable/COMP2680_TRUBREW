<!DOCTYPE html>
<html lang="en">

<head>
    <title>Order Page</title>
    <link rel="stylesheet" href="css/order.css">

</head>

<body>
    <header>
        	<div>
            	<h1>TRUBREW</h1>
            	<img src="images/icons/TRUBREW_Logo.png" alt="TRUBREW Logo" width="50VW" height="50VH">
            	<h2>Fresh Brew for the Pack</h3>
        	</div>
        </header>
		
		<!--Navigation bar-->
		<nav>
			<div>
				<a href="home.html">HOME</a>
				<a href="product_menu.html">MENU</a>
				<a href="order.html">ORDER</a>
				<a href="about_us.html">ABOUT US</a>
			</div>

			<a href="user_profile.html">
				<img src="images/icons/Profile_Icon.png" alt="profileIcon" width="50VW" height="50VH" />
			</a>
		</nav>

        
		<section>
		    <div class="checkout">
				<div class="product">
                    <h2 class="cart"></h2>  <!--Cart items will be dynamically added here-->
					<h2>Total<span>$0.00</span></h2>
				</div>

				<div class="payment">
                    <h2>Payment Information</h2>
					<form>
                        <input type="text" id="name" name="name" size="26" placeholder="Name for Order"><br><br>
                        <input type="text" id="cardNumber" name="cardNumber" size="26" placeholder="Card Number" required><br><br>
                        <input type="text" id="expiryDate" name="expiryDate" size="10" placeholder="Expiry Date" required>
                        <input type="text" id="cvv" name="cvv" size="10" placeholder="CVV" required><br><br>
                        <input type="submit" id="order" value="Place Order">
                    </form>
				</div>
            </div>
		</section>

        <footer>
			<div>
				<a href="https://www.instagram.com/">
					<img src="images/icons/Instagram_Logo.png" alt="InstagramLogo" width="25VW" height="25VH" />
				</a>
				<a href="https://www.tiktok.com/en/">
					<img src="images/icons/TikTok_Logo.png" alt="TikTokLogo" width="25VW" height="25VH" />
				</a>
				<a href="https://www.facebook.com/">
					<img src="images/icons/Facebook_Logo.png" alt="InstagramLogo" width="25VW" height="25VH" />
				</a>
				<a href="https://x.com/">
					<img src="images/icons/X_logo.png" alt="InstagramLogo" width="25VW" height="25VH" />
				</a>
			</div>

			<p>&copy 2025 TruBrew</p>
		</footer>

    <script src="script.js"></script>
</body>
</html>
